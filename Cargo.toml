[package]
name = "roofwm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "tiling wayland compositor written in rust"
license = "MIT"
repository = "https://github.com/YOUR_NAME/RoofWm"
readme = "README.md"

[dependencies]
smithay = { version = "0.4", features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_winit",
    "renderer_gl",
    "wayland_frontend",
] }
calloop = "0.13"
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging", "unstable"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
dirs = "5"

[features]
default = []
winit = []

[profile.release]
lto = "thin"
strip = true
